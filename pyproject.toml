[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crisis-copilot"
version = "3.0.0"
description = "Crisis copilot for power-grid field crews: frugal AI around a deterministic optimisation core"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2", "numpy>=1.26", "pyarrow>=15", "pyyaml>=6", "scipy>=1.12", "scikit-learn>=1.4",
  "joblib>=1.3", "streamlit>=1.35", "plotly>=5.20", "pydeck>=0.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/copilot/ai/field_reports.py" = ["E501"]   # few-shot examples in the LLM prompt

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
